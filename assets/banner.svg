<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Erfouni — AI systems builder</title>
  <desc id="desc">A dark technical banner with circuit traces and labels for machine learning, RAG, MCP, Python, and Docker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050814"/>
      <stop offset="0.52" stop-color="#0a1022"/>
      <stop offset="1" stop-color="#0b1830"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#33e1c6" stop-opacity=".2"/>
      <stop offset="1" stop-color="#33e1c6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6d7da8" stroke-opacity=".09" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#33e1c6" fill-opacity=".18"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="360" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <ellipse cx="810" cy="170" rx="330" ry="230" fill="url(#glow)" filter="url(#blur)"/>

    <g fill="none" stroke="#33e1c6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".55">
      <path d="M720 52h92l30 30h91"/>
      <path d="M756 118h71l22 22h132"/>
      <path d="M704 284h99l30-30h160"/>
      <path d="M905 82v60l30 30h145"/>
      <path d="M808 310v-58l44-44h168"/>
      <path d="M1080 110h-42l-23 23v90"/>
    </g>
    <g fill="#33e1c6" filter="url(#softGlow)">
      <circle cx="720" cy="52" r="4"/><circle cx="933" cy="82" r="4"/>
      <circle cx="756" cy="118" r="4"/><circle cx="981" cy="140" r="4"/>
      <circle cx="704" cy="284" r="4"/><circle cx="993" cy="254" r="4"/>
      <circle cx="1080" cy="172" r="4"/><circle cx="1020" cy="208" r="4"/>
    </g>

    <g transform="translate(910 180)">
      <rect x="-92" y="-72" width="184" height="144" rx="18" fill="#0b1429" stroke="#33e1c6" stroke-width="2"/>
      <rect x="-67" y="-48" width="134" height="96" rx="12" fill="#091020" stroke="#7889b5" stroke-opacity=".55"/>
      <g stroke="#33e1c6" stroke-width="3" opacity=".75">
        <path d="M-92-45h-18m18 30h-18m18 30h-18m18 30h-18M92-45h18M92-15h18M92 15h18M92 45h18"/>
        <path d="M-60-72v-18m40 18v-18m40 18v-18m40 18v-18M-60 72v18m40-18v18m40-18v18m40-18v18"/>
      </g>
      <text x="0" y="-5" fill="#e9f7ff" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="27" font-weight="700">AI</text>
      <text x="0" y="24" fill="#33e1c6" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" letter-spacing="3">SYSTEMS</text>
    </g>

    <g font-family="Consolas, Menlo, monospace">
      <text x="68" y="75" fill="#33e1c6" font-size="15" letter-spacing="4">HELLO, WORLD // I AM</text>
      <text x="64" y="160" fill="#f4f8ff" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="3">ERFOUNI</text>
      <text x="69" y="205" fill="#9faccc" font-size="18" letter-spacing="1.7">AI / ML · RAG · MCP · ENGINEERING AUTOMATION</text>
      <text x="69" y="247" fill="#7181a8" font-size="15">retrieve context → reason → call tools → validate</text>
    </g>

    <g transform="translate(68 276)" font-family="Consolas, Menlo, monospace" font-size="10" font-weight="700">
      <!-- Machine learning: connected neural nodes -->
      <g>
        <rect width="86" height="58" rx="9" fill="#0b172b" stroke="#33e1c6" stroke-opacity=".58"/>
        <g transform="translate(29 7)" fill="none" stroke="#a78bfa" stroke-width="1.7" stroke-linecap="round">
          <path d="M3 6l10 6M3 18l10-6m0 0l10-7m-10 7l10 8" opacity=".8"/>
          <circle cx="3" cy="6" r="2.8" fill="#a78bfa"/><circle cx="3" cy="18" r="2.8" fill="#a78bfa"/>
          <circle cx="13" cy="12" r="3.2" fill="#33e1c6" stroke="#33e1c6"/>
          <circle cx="23" cy="5" r="2.8" fill="#a78bfa"/><circle cx="23" cy="19" r="2.8" fill="#a78bfa"/>
        </g>
        <text x="43" y="49" fill="#d8e3ff" text-anchor="middle">ML</text>
      </g>

      <!-- RAG: knowledge store with retrieval arrow -->
      <g transform="translate(96)">
        <rect width="86" height="58" rx="9" fill="#0b172b" stroke="#33e1c6" stroke-opacity=".58"/>
        <g transform="translate(31 6)" fill="none" stroke="#fbbf24" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="9" cy="5" rx="8" ry="3.5" fill="#fbbf24" fill-opacity=".16"/>
          <path d="M1 5v13c0 2 3.6 3.5 8 3.5 2.1 0 4-.4 5.4-1.1M1 11c0 2 3.6 3.5 8 3.5 1.6 0 3-.2 4.2-.7"/>
          <circle cx="17.5" cy="16" r="5" fill="#0b172b"/>
          <path d="M21.2 19.7l4 4"/>
        </g>
        <text x="43" y="49" fill="#d8e3ff" text-anchor="middle">RAG</text>
      </g>

      <!-- MCP: model-to-tool connector hub -->
      <g transform="translate(192)">
        <rect width="86" height="58" rx="9" fill="#0b172b" stroke="#33e1c6" stroke-opacity=".58"/>
        <g transform="translate(30 6)" fill="none" stroke="#33e1c6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="13" cy="12" r="4" fill="#33e1c6" fill-opacity=".18"/>
          <path d="M13 8V2M9.5 14L4 18m12.5-4l5.5 4"/>
          <rect x="9.5" y="-1" width="7" height="4" rx="1.5"/>
          <rect x="-.5" y="17" width="7" height="4" rx="1.5"/>
          <rect x="19.5" y="17" width="7" height="4" rx="1.5"/>
        </g>
        <text x="43" y="49" fill="#d8e3ff" text-anchor="middle">MCP</text>
      </g>

      <!-- Python brand mark -->
      <g transform="translate(288)">
        <rect width="86" height="58" rx="9" fill="#0b172b" stroke="#33e1c6" stroke-opacity=".58"/>
        <g transform="translate(31 5) scale(1)">
          <path fill="#3776AB" d="M14.25.18l.9.2.73.26.59.3.45.32.34.34.25.34.16.33.1.3.04.26.02.2-.01.13V8.5l-.05.63-.13.55-.21.46-.26.38-.3.31-.33.25-.35.19-.35.14-.33.1-.3.07-.26.04-.21.02H8.77l-.69.05-.59.14-.5.22-.41.27-.33.32-.27.35-.2.36-.15.37-.1.35-.07.32-.04.27-.02.21v3.06H3.17l-.21-.03-.28-.07-.32-.12-.35-.18-.36-.26-.36-.36-.35-.46-.32-.59-.28-.73-.21-.88-.14-1.05-.05-1.23.06-1.22.16-1.04.24-.87.32-.71.36-.57.4-.44.42-.33.42-.24.4-.16.36-.1.32-.05.24-.01h.16l.06.01h8.16v-.83H6.18l-.01-2.75-.02-.37.05-.34.11-.31.17-.28.25-.26.31-.23.38-.2.44-.18.51-.15.58-.12.64-.1.71-.06.77-.04.84-.02 1.27.05zm-6.3 1.98l-.23.33-.08.41.08.41.23.34.33.22.41.09.41-.09.33-.22.23-.34.08-.41-.08-.41-.23-.33-.33-.22-.41-.09-.41.09zm13.09 3.95l.28.06.32.12.35.18.36.27.36.35.35.47.32.59.28.73.21.88.14 1.04.05 1.23-.06 1.23-.16 1.04-.24.86-.32.71-.36.57-.4.45-.42.33-.42.24-.4.16-.36.09-.32.05-.24.02-.16-.01h-8.22v.82h5.84l.01 2.76.02.36-.05.34-.11.31-.17.29-.25.25-.31.24-.38.2-.44.17-.51.15-.58.13-.64.09-.71.07-.77.04-.84.01-1.27-.04-1.07-.14-.9-.2-.73-.25-.59-.3-.45-.33-.34-.34-.25-.34-.16-.33-.1-.3-.04-.25-.02-.2.01-.13v-5.34l.05-.64.13-.54.21-.46.26-.38.3-.32.33-.24.35-.2.35-.14.33-.1.3-.06.26-.04.21-.02.13-.01h5.84l.69-.05.59-.14.5-.21.41-.28.33-.32.27-.35.2-.36.15-.36.1-.35.07-.32.04-.28.02-.21V6.07h2.09l.14.01zm-6.47 14.25l-.23.33-.08.41.08.41.23.33.33.23.41.08.41-.08.33-.23.23-.33.08-.41-.08-.41-.23-.33-.33-.23-.41-.08-.41.08z"/>
        </g>
        <text x="43" y="49" fill="#d8e3ff" text-anchor="middle">PYTHON</text>
      </g>

      <!-- Docker brand mark -->
      <g transform="translate(384)">
        <rect width="86" height="58" rx="9" fill="#0b172b" stroke="#33e1c6" stroke-opacity=".58"/>
        <g transform="translate(31 6)">
          <path fill="#2496ED" d="M13.983 11.078h2.119a.186.186 0 00.186-.185V9.006a.186.186 0 00-.186-.186h-2.119a.185.185 0 00-.185.185v1.888c0 .102.083.185.185.185m-2.954-5.43h2.118a.186.186 0 00.186-.186V3.574a.186.186 0 00-.186-.185h-2.118a.185.185 0 00-.185.185v1.888c0 .102.082.185.185.185m0 2.716h2.118a.187.187 0 00.186-.186V6.29a.186.186 0 00-.186-.185h-2.118a.185.185 0 00-.185.185v1.887c0 .102.082.185.185.186m-2.93 0h2.12a.186.186 0 00.184-.186V6.29a.185.185 0 00-.185-.185H8.1a.185.185 0 00-.185.185v1.887c0 .102.083.185.185.186m-2.964 0h2.119a.186.186 0 00.185-.186V6.29a.185.185 0 00-.185-.185H5.136a.186.186 0 00-.186.185v1.887c0 .102.084.185.186.186m5.893 2.715h2.118a.186.186 0 00.186-.185V9.006a.186.186 0 00-.186-.186h-2.118a.185.185 0 00-.185.185v1.888c0 .102.082.185.185.185m-2.93 0h2.12a.185.185 0 00.184-.185V9.006a.185.185 0 00-.184-.186h-2.12a.185.185 0 00-.184.185v1.888c0 .102.083.185.185.185m-2.964 0h2.119a.185.185 0 00.185-.185V9.006a.185.185 0 00-.184-.186h-2.12a.186.186 0 00-.186.186v1.887c0 .102.084.185.186.185m-2.92 0h2.12a.185.185 0 00.184-.185V9.006a.185.185 0 00-.184-.186h-2.12a.185.185 0 00-.184.185v1.888c0 .102.082.185.185.185M23.763 9.89c-.065-.051-.672-.51-1.954-.51-.338.001-.676.03-1.01.087-.248-1.7-1.653-2.53-1.716-2.566l-.344-.199-.226.327c-.284.438-.49.922-.612 1.43-.23.97-.09 1.882.403 2.661-.595.332-1.55.413-1.744.42H.751a.751.751 0 00-.75.748 11.376 11.376 0 00.692 4.062c.545 1.428 1.355 2.48 2.41 3.124 1.18.723 3.1 1.137 5.275 1.137.983.003 1.963-.086 2.93-.266a12.248 12.248 0 003.823-1.389c.98-.567 1.86-1.288 2.61-2.136 1.252-1.418 1.998-2.997 2.553-4.4h.221c1.372 0 2.215-.549 2.68-1.009.309-.293.55-.65.707-1.046l.098-.288Z"/>
        </g>
        <text x="43" y="49" fill="#d8e3ff" text-anchor="middle">DOCKER</text>
      </g>

      <!-- Git brand mark -->
      <g transform="translate(480)">
        <rect width="86" height="58" rx="9" fill="#0b172b" stroke="#33e1c6" stroke-opacity=".58"/>
        <g transform="translate(31 5)">
          <path fill="#F03C2E" d="M13.09 23.549a1.54 1.54 0 0 1-2.18 0L.451 13.089a1.54 1.54 0 0 1 0-2.179l7.191-7.19 2.733 2.733a1.85 1.85 0 0 0 .964 2.326v6.66a1.849 1.849 0 1 0 1.54 0V8.957l2.508 2.508a1.85 1.85 0 1 0 1.09-1.09l-2.634-2.634a1.85 1.85 0 0 0-2.378-2.377L8.73 2.63 10.91.451a1.54 1.54 0 0 1 2.179 0l10.459 10.46a1.54 1.54 0 0 1 0 2.179z"/>
